# Entity Definitions
# Each entity maps a code-defined data structure (DB table / ORM model) with a precise anchor.
# Code is the single source of truth.

git_commit: "PLACEHOLDER"   # current HEAD when last synced; empty/PLACEHOLDER if no git

entities:
  # Every entry MUST include an `anchor`.

  # --- EXAMPLE ---

  # - name: User
  #   table: users
  #   description: "系统用户表，存储登录账户信息"
  #   anchor:
  #     file: src/models/User.ts
  #     symbol: class User
  #     lines: "12-48"
  #     hash: 9f8a2c
  #   fields:
  #     - name: id
  #       type: bigint
  #       primary: true
  #     - name: name
  #       type: varchar(255)
  #     - name: email
  #       type: varchar(255)
  #       unique: true
  #     - name: org_id
  #       type: bigint
  #       ref: Org.id          # explicit/implicit reference to another entity
